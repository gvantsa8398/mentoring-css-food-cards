<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Manu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Special Offer Just For One Day</h1>
    </header>
    <main>
        <section class="pizza">
            <figure>
                <div class="image1">
                    <img src="/images/Info Icon.png" alt="info icon">
                    <img src="/images/pizza.jpg" alt="pizza">
                </div>
                <figcaption>
                    <h3>Pepperoni Pizza</h3>
                    <p>Premium pepperoni and cheese is made with real mozzarella on original hand-tossed crust.</p>
                    <div>
                      <span>265 Cal</span>
                      <span>P/F/C: 12/10/31</span>
                      <span>53.8 °C</span>
                    </div>
                </figcaption>
            </figure>
            <div class="price-details">
                <span>$23.90</span>
                <span><del>$29.90</del></span>
                <button>ORDER</button>
            </div>
        </section>
        <section class="tortellini">
            <figure>
                <div class="image2">
                    <img src="/images/Info Icon.png" alt="info icon">
                    <img src="/images/Tortellini.jpg" alt="Tortellini">
                </div>
                <figcaption>
                    <h3>Tortellini</h3>
                    <p>Pasta stuffed with beef and pork topped with your choice of cream sauce with bacon, bolognese or marinara sauce.</p>
                    <div>
                      <span>270 Cal</span>
                      <span>P/F/C: 18/4/41</span>
                      <span>42.4 °C</span>
                    </div>                    
                </figcaption>
            </figure>
            <div class="price-details">
                <span>$17.90</span>
                <span><del>$22.90</del></span>
                <button>ORDER</button>
            </div>
        </section>
        <section class="cake">
            <figure>
                <div class="image3">
                    <img src="/images/Info Icon.png" alt="info icon">
                    <img src="/images/cake.jpg" alt="cake">
                </div>
                <figcaption>
                    <h3>Strawberry Cake</h3>
                    <p>Three layer strawberry dessert is not only beautiful looking, but also delicious! Perfect dessert for spring and summer.</p>
                    <div>
                      <span>346 Cal</span>
                      <span>P/F/C: 6/14/49</span>
                      <span>13.9 °C</span>
                    </div>    
                </figcaption>
            </figure>
            <div class="price-details">
                <span>$13.90</span>
                <span><del>$18.90</del></span>
                <button>ORDER</button>
            </div>
        </section>        
    </main>
    <footer>
        <span>© 2026 Good food, Good Mood</span>
    </footer>
</body>
</html>
